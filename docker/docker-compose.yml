services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:-123}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:alpine

  frappe:
    image: frappe/bench:latest
    command: bash /workspace/init.sh
    environment:
      - SHELL=/bin/bash
      - DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-123}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
    working_dir: /home/frappe
    volumes:
      - .:/workspace
    ports:
      - 8000:8000
      - 9000:9000
    depends_on:
      - postgres
      - redis

volumes:
  postgres-data:

